# Lancement complet : docker compose up --build
# Les secrets ci-dessous sont des valeurs de démonstration, à surcharger
# (variables d'environnement ou fichier .env à la racine) hors usage local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lerevenu}
      POSTGRES_USER: ${DATABASE_USERNAME:-lerevenu}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lerevenu}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-lerevenu}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-lerevenu}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-lerevenu}
      APP_KEYS: ${APP_KEYS:-demoKeyA==,demoKeyB==}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-demo-api-token-salt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-demo-admin-jwt-secret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-demo-transfer-token-salt}
      JWT_SECRET: ${JWT_SECRET:-demo-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-demo-encryption-key}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo1234!}
    ports:
      - "1337:1337"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1337/_health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      STRAPI_URL: http://backend:1337
      # L'application est servie en HTTP en local : cookie de session sans l'attribut Secure.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
